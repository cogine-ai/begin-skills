<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="t d"><title id="t">From draft to decision.</title><desc id="d">Original fictional sample work for Reviewroom. This is static review artwork.</desc><rect width="900" height="600" rx="20" fill="#f1f3ee"/><rect x="40" y="32" width="820" height="536" rx="12" fill="white"/><text x="76" y="80" fill="#354a3b" font-size="18" font-family="Arial,sans-serif">COMMON GROUND</text><text x="824" y="80" text-anchor="end" fill="#718078" font-size="13" font-family="Arial,sans-serif">Walkthrough storyboard</text><text x="76" y="154" fill="#2d4736" font-size="35" font-family="Georgia,serif">From draft to decision.</text><text x="76" y="191" fill="#6a7d6e" font-size="16" font-family="Arial,sans-serif">Three moments. One clear next step.</text><rect x="76" y="233" width="238" height="233" rx="11" fill="#eaf0e5"/><circle cx="111" cy="271" r="17" fill="#456744"/><text x="111" y="276" text-anchor="middle" fill="white" font-size="12" font-family="Arial,sans-serif">01</text><rect x="100" y="313" width="190" height="14" rx="4" fill="#bdcfb6"/><rect x="100" y="337" width="130" height="9" rx="3" fill="#d2ddca"/><text x="100" y="390" fill="#314c37" font-size="20" font-family="Georgia,serif">Choose a focus</text><text x="100" y="421" fill="#637c65" font-size="11" font-family="Arial,sans-serif">Give one useful idea a name.</text><rect x="331" y="233" width="238" height="233" rx="11" fill="#eaf0e5"/><circle cx="366" cy="271" r="17" fill="#456744"/><text x="366" y="276" text-anchor="middle" fill="white" font-size="12" font-family="Arial,sans-serif">02</text><rect x="355" y="313" width="190" height="14" rx="4" fill="#bdcfb6"/><rect x="355" y="337" width="130" height="9" rx="3" fill="#d2ddca"/><text x="355" y="390" fill="#314c37" font-size="20" font-family="Georgia,serif">Outline the plan</text><text x="355" y="421" fill="#637c65" font-size="11" font-family="Arial,sans-serif">Make the next action visible.</text><rect x="586" y="233" width="238" height="233" rx="11" fill="#eaf0e5"/><circle cx="621" cy="271" r="17" fill="#456744"/><text x="621" y="276" text-anchor="middle" fill="white" font-size="12" font-family="Arial,sans-serif">03</text><rect x="610" y="313" width="190" height="14" rx="4" fill="#bdcfb6"/><rect x="610" y="337" width="130" height="9" rx="3" fill="#d2ddca"/><text x="610" y="390" fill="#314c37" font-size="20" font-family="Georgia,serif">Take the next step</text><text x="610" y="421" fill="#637c65" font-size="11" font-family="Arial,sans-serif">Keep a record of what worked.</text><path d="M76 503H824" stroke="#e4e8e0"/><text x="76" y="538" fill="#7a887a" font-size="12" font-family="Arial,sans-serif">Product walkthrough · v01 · Static sample storyboard</text></svg>