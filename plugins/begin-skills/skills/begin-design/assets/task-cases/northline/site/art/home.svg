<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 740" role="img" aria-labelledby="home-title home-desc"><title id="home-title">The evening threshold — 6 × 9 m lighting study</title><desc id="home-desc">Original illustrative floor plan. Ambient light is a dotted field, task light uses solid outlined zones, accent light uses dashed washes. Furniture, entry, dimensions and three role annotations are shown. These are conceptual spatial roles, not an installation drawing.</desc><style>text{font-family:Arial,sans-serif;fill:#464841;font-size:17px}.dimensions path,.drawing-footer path{fill:none;stroke:#7f8179;stroke-width:1}.dimensions text{font-size:19px;letter-spacing:1px}.windows path{fill:none;stroke:#444641;stroke-width:1.5}.furniture{fill:#f4f4ee;stroke:#66685f;stroke-width:1.2}.furniture text{stroke:none;font-size:13px;letter-spacing:1px}.task-pool{fill:#bcbdb1;fill-opacity:.22;stroke:#42483d;stroke-width:2}.lamp{fill:#33392e;stroke:none}.accent-pool{fill:#8c8f80;fill-opacity:.2;stroke:#6c7063;stroke-width:1.8;stroke-dasharray:8 6}.accent-beam{fill:none;stroke:#7d8172;stroke-width:1;stroke-dasharray:3 6}.door{fill:none;stroke:#6d7065;stroke-width:1.5}.markers circle{fill:#f9f9f4;stroke:#44483d;stroke-width:1}.markers text{font-size:13px;text-anchor:middle}.note path{stroke:#85877d;stroke-width:1}.note-title{font-size:17px;letter-spacing:1px}.drawing-footer text{font-size:13px;letter-spacing:1px}[hidden]{display:none!important}</style><defs><pattern id="home-hatch" width="7" height="7" patternUnits="userSpaceOnUse"><path d="M-1 1 1-1M0 7 7 0M6 8 8 6" stroke="#b5b5af" stroke-width="1"/></pattern><pattern id="home-dots" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r="1.25" fill="#888983"/></pattern></defs><rect x="0" y="0" width="960" height="740" fill="#f4f4ee"/>
