<svg id="table-phone-drawing" xmlns="http://www.w3.org/2000/svg" viewBox="85 25 510 730" role="img" aria-labelledby="table-phone-title table-phone-desc"><title id="table-phone-title">A quieter table — 8 × 12 m lighting study</title><desc id="table-phone-desc">Original illustrative floor plan. Ambient light is a dotted field, task light uses solid outlined zones, accent light uses dashed washes. Furniture, entry, dimensions, north, and scale annotations are shown. Three role notes accompany the drawing in the page. These are conceptual spatial roles, not an installation drawing.</desc><style>#table-phone-drawing text{font-family:Arial,sans-serif;fill:#464841;font-size:17px}#table-phone-drawing .dimensions path,#table-phone-drawing .drawing-footer path{fill:none;stroke:#7f8179;stroke-width:1}#table-phone-drawing .dimensions text{font-size:21px;letter-spacing:1px}#table-phone-drawing .windows path{fill:none;stroke:#444641;stroke-width:1.5}#table-phone-drawing .furniture{fill:#f4f4ee;stroke:#66685f;stroke-width:1.2}#table-phone-drawing .furniture text{stroke:none;font-size:19px;letter-spacing:1px}#table-phone-drawing .task-pool{fill:#bcbdb1;fill-opacity:.22;stroke:#42483d;stroke-width:2}#table-phone-drawing .lamp{fill:#33392e;stroke:none}#table-phone-drawing .accent-pool{fill:#8c8f80;fill-opacity:.2;stroke:#6c7063;stroke-width:1.8;stroke-dasharray:8 6}#table-phone-drawing .accent-beam{fill:none;stroke:#7d8172;stroke-width:1;stroke-dasharray:3 6}#table-phone-drawing .door{fill:none;stroke:#6d7065;stroke-width:1.5}#table-phone-drawing .markers circle{fill:#f9f9f4;stroke:#44483d;stroke-width:1}#table-phone-drawing .markers text{font-size:18px;text-anchor:middle}#table-phone-drawing .note path{stroke:#85877d;stroke-width:1}#table-phone-drawing .note-title{font-size:17px;letter-spacing:1px}#table-phone-drawing .drawing-footer text{font-size:13px;letter-spacing:1px}#table-phone-drawing [hidden]{display:none!important}</style><defs><pattern id="table-phone-hatch" width="7" height="7" patternUnits="userSpaceOnUse"><path d="M-1 1 1-1M0 7 7 0M6 8 8 6" stroke="#b5b5af" stroke-width="1"/></pattern><pattern id="table-phone-dots" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r="1.25" fill="#888983"/></pattern></defs><rect x="0" y="0" width="960" height="740" fill="#f4f4ee"/>
